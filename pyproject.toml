[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-ads-tool"
version = "5.5.1"
description = "Exporter laporan Meta Ads ke XLSX/CSV dengan checkpoint dan resume."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=7.4",
]

[project.scripts]
scrape-meta = "meta_ads_tool.cli:main"

[tool.setuptools]
packages = [
    "meta_ads_tool",
    "meta_ads_tool.accounts",
    "meta_ads_tool.graph",
    "meta_ads_tool.processing",
    "meta_ads_tool.reporting",
    "meta_ads_tool.reporting.xlsx",
    "meta_ads_tool.storage",
]

# ---------------------------------------------------------------------------
# ruff
#
# Catatan: E501 sengaja diabaikan. Baris panjang di module ini sering berisi
# string yang masuk ke laporan (pesan error, label delimiter, teks sheet
# Informasi). Memotong atau menyusun ulang string tersebut berisiko mengubah
# output file, sehingga panjang baris bukan kriteria kualitas di project ini.
#
# Aturan `UP` sengaja TIDAK diaktifkan agar tidak memaksakan sintaks Python 3.9+
# (mis. list[str]) ke kode yang harus tetap jalan di 3.8.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py38"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "*.egg-info",
    "tests/golden/snapshots",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test sengaja melakukan import di dalam fungsi untuk mempatch target,
# menumpuk import, dan memakai nama pendek pada fixture.
"tests/**" = ["E402", "F401", "F811", "B018"]

# ---------------------------------------------------------------------------
# pytest
#
# Pytest bersifat opsional; suite tetap bisa jalan dengan
#   python3 -m unittest discover -s tests -v
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]
